version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Iniciando install com lockfile"  # Log customizado para debug
        - npm ci --cache .npm --prefer-offline  # Agora com lockfile, passa!
    build:
      commands:
        - npm run build  # Ajuste se o script for diferente (ex.: "build:prod")
  artifacts:
    baseDirectory: /build  # Confirme: para React é /build; para outros, ajuste
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*