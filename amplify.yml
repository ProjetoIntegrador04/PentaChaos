version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Navegando para frontend/FrontProject e iniciando install"
        - cd frontend/FrontProject  # Entra na subpasta do frontend
        - npm ci --cache .npm --prefer-offline  # Agora usa o lockfile local!
        # Opcional: - npm run lint  # Para qualidade, se quiser
    build:
      commands:
        - echo "Rodando build no frontend"
        - npm run build  # Builda na subpasta (gera /build lá)
  artifacts:
    baseDirectory: frontend/FrontProject/build  # Pasta de saída: aponta para o build gerado na subpasta
    files:
      - '**/*'  # Inclui todos os arquivos do build
  cache:
    paths:
      - frontend/FrontProject/node_modules/**/*  # Cache específico da subpasta (acelera!)
      - .npm/**/*  # Cache npm global