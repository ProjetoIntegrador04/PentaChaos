# H2 Database Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update # create, update, create-drop. 'update' é bom para desenvolvimento.

# JWT Configuration
# ATENÇÃO: Em produção, este segredo DEVE ser carregado de variáveis de ambiente
# ou de um serviço de gerenciamento de segredos, NUNCA hardcoded aqui.
jwt.secret=94f5a3e1b7c0d2e8f6a9c3d7b2a6f8e4c1d5e0f7b9a3c6d2e0f5b8a1c9d4e7f0
jwt.expiration=86400000 # 24 horas em milissegundos (24 * 60 * 60 * 1000)

# Springdoc OpenAPI (Swagger) Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs