# Configuração para testes
# CI sobrescreve com PostgreSQL via variáveis de ambiente
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para testes (CI sobrescreve se necessário)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar comandos PostgreSQL específicos
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.sql.init.mode=never

# JWT para testes
jwt.secret=mySecretKeyForTestsOnly123456789
jwt.expiration=86400000

# Logging para testes
logging.level.org.springframework.web=INFO
logging.level.com.sge.sge_app=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO