# Configuração para testes - usa PostgreSQL no CI, H2 localmente
# As variáveis de ambiente do CI sobrescrevem estas configurações
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate para testes
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Desabilitar comandos PostgreSQL específicos
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.sql.init.mode=never

# JWT para testes
jwt.secret=mySecretKeyForTestsOnly123456789
jwt.expiration=86400000

# Logging para testes (menos verboso)
logging.level.org.springframework.web=INFO
logging.level.com.sge.sge_app=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO