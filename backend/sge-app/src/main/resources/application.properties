spring.application.name=sge-app
# --- Database Configuration (PostgreSQL Docker Local) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
# spring.datasource.username=${POSTGRES_USER}
# spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.url=jdbc:postgresql://localhost:5432/sge_app_db
spring.datasource.username=admin_sge
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Executar data.sql após criar as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- JWT Configuration ---
# jwt.secret-key=${JWT_SECRET_KEY}
jwt.secret-key=i0o++I7jThwmozMy2cNjH+HeC6d6LBqKkoPbi3yYIfA=
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# --- Logging Configuration ---

spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.transaction=TRACE

# --- Error handling ---
server.error.include-message=always
server.error.include-binding-errors=always