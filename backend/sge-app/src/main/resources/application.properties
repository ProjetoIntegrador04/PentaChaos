spring.application.name=sge-app

# --- Encoding Configuration ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Database Configuration (PostgreSQL Docker Local) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
# spring.datasource.username=${POSTGRES_USER}
# spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA/Hibernate Configuration ---
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# Executar data.sql após criar as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- JWT Configuration ---
# jwt.secret-key=${JWT_SECRET_KEY}
jwt.secret-key=i0o++I7jThwmozMy2cNjH+HeC6d6LBqKkoPbi3yYIfA=
# Access Token: 7 dias (604800000 ms)
jwt.expiration=604800000
# Refresh Token: 30 dias (2592000000 ms)
jwt.refresh-expiration=2592000000

# --- Logging Configuration ---

spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.transaction=TRACE

# --- Error handling ---
server.error.include-message=always
server.error.include-binding-errors=always