name: Backend Build Validation

on:
  push:
    branches:
      - feature/ci-cd
  pull_request:
    branches:
      - feature/ci-cd

jobs:
  validate-backend:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build backend with Maven
        run: mvn -B package
        working-directory: ./backend/sge-app

      - name: Run backend tests
        run: mvn test
        working-directory: ./backend/sge-app
