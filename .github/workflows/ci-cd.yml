name: Backend CI

on:
  push:
    branches:
      - feature/ci-cd
  pull_request:
    branches:
      - feature/ci-cd

jobs:
  validate-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build backend (compilation + syntax validation)
        working-directory: ./backend/sge-app
        run: mvn -B -e -X clean compile
        # Docker compose Up

      - name: Run tests
        working-directory: ./backend/sge-app
        run: mvn test
