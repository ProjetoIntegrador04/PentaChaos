name: Backend CI

on:
  push:
    branches: [ feature/ci-cd ]
  pull_request:
    branches: [ feature/ci-cd ]

jobs:
  validate-backend:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala o Java 17 (Temurin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven   # cache automático para acelerar builds

      # Validação do Build (compilação) → aqui verifica sintaxe
      - name: Build backend
        run: mvn -B clean package
        working-directory: ./backend/sge-app

      # Execução dos testes
      - name: Run tests
        run: mvn test
        working-directory: ./backend/sge-app

      # Gera artifacts (opcional)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/sge-app/target/
          retention-days: 7
