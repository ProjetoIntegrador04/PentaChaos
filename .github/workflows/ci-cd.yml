name: CI Build Validation

on:
  push:
    branches:
      - feature/ci-cd
  pull_request:
    branches:
      - feature/ci-cd

jobs:

  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build backend with Maven
        run: mvn -B package
        working-directory: backend/sge-app

      - name: Run backend tests
        run: mvn test
        working-directory: backend/sge-app

  validate-frontend:
    name: Validate Frontend
    runs-on: ubuntu-latest
    needs: validate-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/frontProject

      - name: Build frontend
        run: npm run build
        working-directory: frontend/frontProject

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend/frontProject
