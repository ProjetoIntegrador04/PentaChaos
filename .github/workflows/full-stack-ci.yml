name: Full Stack CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-backend:
    name: 🧪 Test Backend
    uses: ./.github/workflows/backend-ci.yml
    secrets: inherit

  test-frontend:
    name: 🧪 Test Frontend
    uses: ./.github/workflows/frontend-ci.yml
    secrets: inherit

  integration-tests:
    name: 🔗 Integration Tests
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐳 Start services
      run: |
        cd backend/sge-app
        docker compose up -d
        echo "Waiting for services to be ready..."
        sleep 30

    - name: 🧪 Run integration tests
      run: |
        echo "Testing backend health..."
        curl -f http://localhost:8080/actuator/health || exit 1
        echo "✅ Backend is healthy!"
        
        echo "Testing database connection..."
        docker exec sge-backend curl -f http://localhost:8080/actuator/health || exit 1
        echo "✅ Database is connected!"

    - name: 🧹 Cleanup
      if: always()
      run: |
        cd backend/sge-app
        docker compose down -v

  deploy-production:
    name: 🚀 Deploy to Production
    needs: [test-backend, test-frontend, integration-tests]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sge-app.duckdns.org
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🎉 Deployment successful
      run: |
        echo "========================================="
        echo "   🚀 DEPLOYMENT TO PRODUCTION"
        echo "========================================="
        echo ""
        echo "✅ Backend tests: PASSED"
        echo "✅ Frontend tests: PASSED"
        echo "✅ Integration tests: PASSED"
        echo ""
        echo "📦 Deployed version: ${{ github.sha }}"
        echo "👤 Deployed by: ${{ github.actor }}"
        echo "📝 Commit: ${{ github.event.head_commit.message }}"
        echo ""
        echo "🌐 URLs:"
        echo "   Backend:  https://sge-app.duckdns.org:8080"
        echo "   Frontend: https://sge-app.duckdns.org:3000"
        echo "   Mobile:   https://sge-app.duckdns.org:8081"
        echo ""
        echo "========================================="
