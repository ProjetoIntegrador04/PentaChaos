name: Mobile CI/CD

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'integrador-mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'integrador-mobile/**'

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: integrador-mobile/package-lock.json

    - name: 📥 Install dependencies
      working-directory: ./integrador-mobile
      run: npm ci

    - name: 🔧 Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    # Descomente quando configurar EAS
    # - name: 🤖 Build Android APK
    #   working-directory: ./integrador-mobile
    #   run: |
    #     npx eas-cli build --platform android --profile production --non-interactive --no-wait
    #     echo "✅ Android build initiated!"

    - name: 📢 Build notification
      run: |
        echo "📱 Mobile build process started"
        echo "Platform: Android"
        echo "Environment: Production"
        echo "API URL: https://sge-app.duckdns.org"

  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: integrador-mobile/package-lock.json

    - name: 📥 Install dependencies
      working-directory: ./integrador-mobile
      run: npm ci

    - name: 🌐 Build for web
      working-directory: ./integrador-mobile
      env:
        EXPO_PUBLIC_API_URL: https://sge-app.duckdns.org
      run: npx expo export --platform web

    - name: ⬆️ Upload web build
      uses: actions/upload-artifact@v4
      with:
        name: mobile-web
        path: integrador-mobile/dist
        retention-days: 5
