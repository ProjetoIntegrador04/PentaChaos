name: Frontend CI/CD

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:  # ⭐ Permite disparar manualmente pelo GitHub

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/frontProject/package-lock.json

    - name: 📥 Install dependencies
      working-directory: ./frontend/frontProject
      run: npm ci

    - name: 🔍 Lint check
      working-directory: ./frontend/frontProject
      run: npm run lint || echo "⚠️ Linting warnings found"

    - name: 🏗️ Build application
      working-directory: ./frontend/frontProject
      env:
        VITE_API_URL: https://sge-app.duckdns.org
      run: npm run build

    - name: ⬆️ Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/frontProject/dist
        retention-days: 5

  deploy:
    name: Deploy to S3
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Download artifact
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: ./dist

    # Descomente quando configurar S3
    # - name: 🔑 Configure AWS credentials
    #   uses: aws-actions/configure-aws-credentials@v4
    #   with:
    #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
    #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    #     aws-region: us-east-1

    # - name: 🚀 Deploy to S3
    #   run: |
    #     aws s3 sync ./dist s3://pentachaos-frontend/ --delete
    #     aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*"

    - name: ✅ Deployment notification
      run: |
        echo "🎉 Frontend deployed successfully!"
        echo "Build from: ${{ github.sha }}"
        echo "Deployed by: ${{ github.actor }}"
